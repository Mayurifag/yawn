name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: go.sum

      - name: Tidy modules
        run: go mod tidy -diff

      - name: Check formatting
        run: make check-fmt

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Test with Race Detector and Coverage
        run: make test-race

      - name: Build
        run: make build
